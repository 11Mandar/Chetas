<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chetas icon</title>
  <desc>A circular tech emblem: an eight-color segmented ring, circuit traces with pads, and a two-tone hexagon core</desc>

  <!-- eight-color segmented outer ring -->
  <path d="M150.0,40.0 A110,110 0 0 1 227.8,72.2 L212.2,87.8 A88,88 0 0 0 150.0,62.0 Z" fill="#4F46E5"/>
  <path d="M227.8,72.2 A110,110 0 0 1 260.0,150.0 L238.0,150.0 A88,88 0 0 0 212.2,87.8 Z" fill="#7C3AED"/>
  <path d="M260.0,150.0 A110,110 0 0 1 227.8,227.8 L212.2,212.2 A88,88 0 0 0 238.0,150.0 Z" fill="#2563EB"/>
  <path d="M227.8,227.8 A110,110 0 0 1 150.0,260.0 L150.0,238.0 A88,88 0 0 0 212.2,212.2 Z" fill="#06B6D4"/>
  <path d="M150.0,260.0 A110,110 0 0 1 72.2,227.8 L87.8,212.2 A88,88 0 0 0 150.0,238.0 Z" fill="#0891B2"/>
  <path d="M72.2,227.8 A110,110 0 0 1 40.0,150.0 L62.0,150.0 A88,88 0 0 0 87.8,212.2 Z" fill="#10B981"/>
  <path d="M40.0,150.0 A110,110 0 0 1 72.2,72.2 L87.8,87.8 A88,88 0 0 0 62.0,150.0 Z" fill="#F59E0B"/>
  <path d="M72.2,72.2 A110,110 0 0 1 150.0,40.0 L150.0,62.0 A88,88 0 0 0 87.8,87.8 Z" fill="#EC4899"/>

  <!-- thin separators between ring segments -->
  <line x1="150.0" y1="40" x2="150.0" y2="62" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="227.8" y1="72.2" x2="212.2" y2="87.8" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="260.0" y1="150" x2="238.0" y2="150" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="227.8" y1="227.8" x2="212.2" y2="212.2" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="150.0" y1="260" x2="150.0" y2="238" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="72.2" y1="227.8" x2="87.8" y2="212.2" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="40.0" y1="150" x2="62.0" y2="150" stroke="#0B0F19" stroke-width="1.5"/>
  <line x1="72.2" y1="72.2" x2="87.8" y2="87.8" stroke="#0B0F19" stroke-width="1.5"/>

  <!-- inner circuit ring boundary -->
  <circle cx="150" cy="150" r="88" fill="#0B0F19"/>
  <circle cx="150" cy="150" r="88" fill="none" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="150" cy="150" r="66" fill="none" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="0.75" stroke-dasharray="2 4"/>

  <!-- circuit traces from core to pads -->
  <line x1="150.0" y1="116.0" x2="150.0" y2="84.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="179.4" y1="133.0" x2="207.2" y2="117.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="179.4" y1="167.0" x2="207.2" y2="183.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="150.0" y1="184.0" x2="150.0" y2="216.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="120.6" y1="167.0" x2="92.8" y2="183.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>
  <line x1="120.6" y1="133.0" x2="92.8" y2="117.0" stroke="#E6EDF3" stroke-width="1.5" stroke-opacity="0.85"/>

  <circle cx="150.0" cy="84.0" r="4" fill="#F2FBFF"/>
  <circle cx="207.2" cy="117.0" r="4" fill="#F2FBFF"/>
  <circle cx="207.2" cy="183.0" r="4" fill="#F2FBFF"/>
  <circle cx="150.0" cy="216.0" r="4" fill="#F2FBFF"/>
  <circle cx="92.8" cy="183.0" r="4" fill="#F2FBFF"/>
  <circle cx="92.8" cy="117.0" r="4" fill="#F2FBFF"/>

  <!-- two-tone hexagon core -->
  <polygon points="150,116 179.4,133 179.4,167 150,184 120.6,167 120.6,133" fill="#4F46E5"/>
  <polygon points="150,116 179.4,133 179.4,167 150,184" fill="#06B6D4"/>
  <polygon points="150,150 150,116 179.4,133" fill="#7C3AED" fill-opacity="0.55"/>
  <polygon points="150,150 179.4,167 150,184" fill="#0891B2" fill-opacity="0.55"/>
  <circle cx="150" cy="150" r="9" fill="#F2FBFF"/>
</svg>
